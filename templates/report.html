{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">
{% endblock %}

{% block content %}
<div class="report-container">
  <h1>Report</h1>
  <!--TIP : 처리 속도가 일정하지 않을 수 있습니다-->
  <label>아래에 문제가 있는 티켓(URL)을 제출하세요 <label>
  <label>예매 오류가 발생한 경우 확인이 필요합니다.</label>
  
  {% if msg %}
    <div class="msg">{{ msg }}</div>
  {% endif %}
  
  <form method="POST">
    <input name="path" type="text" placeholder="문제 발생 신고">
    <button type="submit">Submit</button>
  </form>
  
  <small>예매 스탭이 실시간으로 확인 중입니다.....</small>
</div>
{% endblock %}
