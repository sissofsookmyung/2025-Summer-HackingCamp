{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
{% endblock %}

{% block content %}
<div class="user-container">
  <h2>회원가입</h2>
  {% if error %}<div class="msg">{{ error }}</div>{% endif %}
  <form method="POST">
    <input name="username" type="text" placeholder="아이디" autocomplete="off">
    <input name="password" type="password" placeholder="비밀번호" autocomplete="off">
    <button type="submit">회원가입</button>
  </form>
</div>
{% endblock %}
